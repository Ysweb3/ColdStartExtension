<!DOCTYPE html>
<!-- Extension popup — artboard 1j, on the app's 5a tokens (DESIGN.md, "The extension").
     Adding this replaces chrome.action.onClicked (Chrome suppresses that once a
     popup is set). Unticked tabs are ignored by checkpoints; the footer ignores the
     current tab or brings the app forward. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Bold.ttf"); font-weight: 700; }

/* the app's hud.css tokens, one for one */
:root {
  --ground:#000000; --ink-900:#0F1012; --ink-800:#16171A; --ink-750:#1E2024;
  --raised:#222428; --line:#32353B; --line-strong:#464A52;
  --bone:#E9E3DF; --bone-2:#A8A29E; --bone-3:#77726E; --bone-3-text:#8E8A86;
  --resume-orange:#FF6500;
  --checkpoint-blue:#2A5688; --checkpoint-blue-bright:#6E9BD1;
  --live-green:#5DB075; --live-green-text:#8ACB9D;
  --brick-text:#EB7C73; --active:#8E939C;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; width: 360px; height: 420px;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--ground); font-family: var(--sans);
}
/* what you act on is notched; rows and containers stay square */
.cut { clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px)); }
.ico { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

.bar {
  height: 38px; flex: 0 0 38px; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--ink-900); border-bottom: 1px solid var(--line);
}
.mark { width: 14px; height: 14px; flex: 0 0 14px; }
.wordmark { font: 700 12px/1.2 var(--sans); color: var(--bone); }
.wordmark i { color: var(--resume-orange); font-style: normal; }
.spacer { flex: 1; }
/* flat dots: grey idle, green live, never a glow */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bone-3); flex: 0 0 7px; }
.dot.live { background: var(--live-green); }
.port { font: 400 12px/1.4 var(--mono); color: var(--bone-3-text); }
.port.live { color: var(--live-green-text); font-weight: 700; }

.body {
  flex: 1; min-height: 0; padding: 16px 12px 12px;
  display: flex; flex-direction: column; gap: 8px; overflow: hidden;
}
.lede { font: 400 12px/1.45 var(--sans); color: var(--bone-2); }
.lede b { font-weight: 600; color: var(--bone); }

.tabs {
  display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.tab {
  display: flex; align-items: center; gap: 10px; height: 34px; flex: 0 0 34px;
  padding: 0 10px; background: var(--ink-800); border: 1px solid var(--line);
  cursor: pointer;
}
.tab:hover { background: var(--ink-750); }
.tab.off { background: var(--ink-900); }
/* the app's checkbox glyph: the box always, the tick only while kept. Ink says the state. */
.box { width: 18px; height: 18px; color: var(--bone); }
.tab.off .box { color: var(--bone-3); }
.tab.off .tick { display: none; }
.url {
  min-width: 0; font: 400 12px/1.3 var(--mono); color: var(--bone);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tab.off .url { color: var(--bone-3-text); }

/* a fold row, as in the app's Settings: it acts, so it ends in a chevron and steps up under the pointer */
.more {
  display: flex; align-items: center; gap: 10px; height: 48px; flex: 0 0 48px;
  padding: 0 16px; background: var(--ink-900); border: 1px solid var(--line);
  color: var(--bone-3); cursor: pointer;
}
.more:hover { background: var(--ink-800); border-color: var(--line-strong); }
.more[hidden] { display: none; }   /* display:flex above out-ranks the hidden attribute */
.more .label { font: 700 13px/1 var(--sans); color: var(--bone); }
.more .excluded { font: 400 12px/1.4 var(--mono); color: var(--bone-2); }
.more .chev { transform: rotate(90deg); }
.more.open .chev { transform: rotate(-90deg); }

.foot {
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  border-top: 1px solid var(--line);
}
.actions { display: flex; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  flex: 1; min-width: 0; height: 34px; border: 0; padding: 0 12px;
  font: 600 13px/1 var(--sans); cursor: pointer; white-space: nowrap;
}
.btn:disabled { opacity: .45; cursor: default; }
/* neither checkpoints nor resumes, so neither blue nor orange: a quiet edge for Ignore,
   the app's bone neutral main action (.btn-primary) for Open, darker under the pointer */
.ignore { background: var(--ink-800); color: var(--bone); box-shadow: inset 0 0 0 1px var(--line-strong); }
.ignore:hover:not(:disabled) { background: var(--ink-750); }
.open { background: var(--bone); color: var(--ink-900); }
.open:hover:not(:disabled) { background: #D9D2CD; }
.status { font: 400 12px/1.4 var(--mono); color: var(--bone-3-text); min-height: 17px; }
.status.bad { color: var(--brick-text); }

/* keyboard focus: the neutral Active ring. A button's notch would clip an outline, so its ring is inset. */
.tab:focus-visible, .more:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--active); }

@media (prefers-reduced-motion: no-preference) {
  .tab, .more, .btn { transition: background-color 140ms cubic-bezier(.2,.8,.3,1), border-color 140ms cubic-bezier(.2,.8,.3,1); }
  .btn:active:not(:disabled), .more:active { transform: scale(.985); transition-duration: 80ms; }
  .more .chev { transition: transform 220ms cubic-bezier(.2,.8,.3,1); }
  /* the tick draws itself in, as the app's does */
  .tab.drawn .tick { stroke-dasharray: 15; animation: draw 360ms cubic-bezier(.16,1,.3,1); }
  @keyframes draw { from { stroke-dashoffset: 15; } to { stroke-dashoffset: 0; } }
}
</style>
</head>
<body>
  <div class="bar">
    <!-- coldstart-icon-handoff/svg/coldstart-mark.svg: slanted pause + play -->
    <svg class="mark" viewBox="96 96 320 320" fill="none" stroke-width="20" stroke-linejoin="round">
      <polygon points="169,152 233,152 183,360 119,360" fill="#4B607F" stroke="#4B607F"></polygon>
      <polygon points="283,152 393,256 233,360" fill="#F3701E" stroke="#F3701E"></polygon>
    </svg>
    <span class="wordmark">coldstart<i>.</i></span>
    <span class="spacer"></span>
    <span class="dot" id="dot"></span>
    <span class="port" id="conn">checking…</span>
  </div>

  <div class="body">
    <span class="lede" id="lede">Reading tabs…</span>
    <div class="tabs" id="tabs"></div>
    <div class="more" id="more" role="button" tabindex="0" hidden>
      <svg class="ico" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>
      <span class="label" id="moreLabel"></span>
      <span class="spacer"></span>
      <span class="excluded" id="excluded"></span>
      <svg class="ico chev" width="14" height="14" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </div>
  </div>

  <div class="foot">
    <div class="actions">
      <button class="btn ignore cut" id="ignore">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>
        <span id="ignoreLabel">Ignore this tab</span>
      </button>
      <button class="btn open cut" id="open">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        Open coldstart
      </button>
    </div>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
